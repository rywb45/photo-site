name: Generate site artifacts

on:
  workflow_dispatch:
    inputs:
      regen_photos_json:
        description: "Also regenerate photos.json from filesystem (destructive; edit mode is the source of truth)"
        type: boolean
        default: false
  # Weekly safety net: regenerates pages even if a push trigger was missed
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: ["main"]
    paths:
      - "photos.json"
      - "index.html"
      - "tools/generate-album-pages.js"
      - ".github/workflows/generate-photos.yml"

permissions:
  contents: write

concurrency:
  group: generate-site-artifacts
  cancel-in-progress: true

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Edit mode pushes many commits in quick succession, so a push from this
      # job can be rejected as non-fast-forward. Instead of failing (which is
      # what got this workflow disabled), redo the whole fetch -> generate ->
      # push cycle against the newest main until it lands.
      - name: Generate and push (with retry)
        env:
          REGEN: ${{ inputs.regen_photos_json == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ "$REGEN" = "true" ]; then
              npm run gen
            fi
            npm run gen:albums

            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Auto-update site artifacts (album pages)"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt); re-syncing with main and retrying"
            sleep $((attempt * 3))
          done

          echo "Push still rejected after 5 attempts"
          exit 1
